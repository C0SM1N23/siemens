<svg xmlns="http://www.w3.org/2000/svg" width="670" height="920" viewBox="0 0 670 920">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#006B75"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<rect x="40" y="30" width="590" height="160" rx="7" fill="#EDF5F5" stroke="#006B75" stroke-width="2"/>
<text x="335.0" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#173442">1 · Configure</text>
<text x="335.0" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526772">mtvec = handler address</text>
<text x="335.0" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526772">mie[16+n] = 1</text>
<polyline points="335,190 335,250" fill="none" stroke="white" stroke-width="10"/>
<polyline points="335,190 335,250" fill="none" stroke="#006B75" stroke-width="3"/>
<polygon points="335,250 341.0,237.0 329.0,237.0" fill="#006B75"/>
<rect x="40" y="250" width="590" height="160" rx="7" fill="#EDF5F5" stroke="#006B75" stroke-width="2"/>
<text x="335.0" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#173442">2 · Enable</text>
<text x="335.0" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526772">mstatus.MIE = 1</text>
<text x="335.0" y="361" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526772">source n can be accepted</text>
<polyline points="335,410 335,470" fill="none" stroke="white" stroke-width="10"/>
<polyline points="335,410 335,470" fill="none" stroke="#006B75" stroke-width="3"/>
<polygon points="335,470 341.0,457.0 329.0,457.0" fill="#006B75"/>
<rect x="40" y="470" width="590" height="160" rx="7" fill="#EDF5F5" stroke="#006B75" stroke-width="2"/>
<text x="335.0" y="509" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#173442">3 · Enter handler</text>
<text x="335.0" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526772">HW saves mepc / mcause / mtval</text>
<text x="335.0" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526772">HW clears MIE; sends claim</text>
<polyline points="335,630 335,690" fill="none" stroke="white" stroke-width="10"/>
<polyline points="335,630 335,690" fill="none" stroke="#006B75" stroke-width="3"/>
<polygon points="335,690 341.0,677.0 329.0,677.0" fill="#006B75"/>
<rect x="40" y="690" width="590" height="160" rx="7" fill="#EDF5F5" stroke="#006B75" stroke-width="2"/>
<text x="335.0" y="729" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#173442">4 · Return</text>
<text x="335.0" y="769" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526772">service + clear the source</text>
<text x="335.0" y="801" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526772">MRET → mepc; EOI to PIC</text>
<text x="335" y="909" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526772">CPU instructions ↔ hardware state</text>
</svg>