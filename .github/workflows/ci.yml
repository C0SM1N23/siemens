# Runs the Verilator lint + SVA + functional-coverage flows on every push/PR.
# ModelSim ASE can't run in CI (no headless license), so the reference
# regression stays local; Verilator covers the same testbenches here.
#
# Both flows run, and both gate the build. The CPU flow alone was not enough:
# it never elaborates soc_top, so nothing in the interconnect, the address map
# or the burst bridge was checked by CI at all.
name: CI

on:
  push:
    branches: [master, RISCV, DMA, SDRAM]
  pull_request:
    branches: [master, RISCV, DMA, SDRAM]

jobs:
  verilator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The flows are recorded with Verilator 5.050. The Ubuntu package is older
      # and its --binary main writes no coverage database, so the release is
      # built from its tag once and restored from the cache afterwards.
      - name: Cache Verilator 5.050
        id: verilator-cache
        uses: actions/cache@v4
        with:
          path: ~/verilator
          key: verilator-v5.050-ubuntu-24.04

      - name: Build Verilator 5.050
        if: steps.verilator-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git help2man perl python3 make autoconf g++ flex bison libfl2 libfl-dev zlib1g zlib1g-dev
          git clone --depth 1 --branch v5.050 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$HOME/verilator"
          make -j"$(nproc)"
          make install

      - name: Put Verilator on PATH
        run: |
          echo "$HOME/verilator/bin" >> "$GITHUB_PATH"
          "$HOME/verilator/bin/verilator" --version

      - name: CPU - assemble + run SVA / functional-coverage flow
        run: make test

      - name: SoC - lint + run every bench with the bind layer live
        run: make soc-sva
